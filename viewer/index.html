<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NammaSpace — Round 1 Viewer</title>
    <style>:root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0b0d10; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: rgba(11, 13, 16, 0.72); backdrop-filter: blur(4px);
        color: #e7ecf2; text-align: center; cursor: pointer; z-index: 10;
        transition: opacity 0.25s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.3px; }
      #overlay .cta {
        padding: 12px 22px; border: 1px solid #3a4552; border-radius: 10px;
        background: #151a20; font-size: 15px;
      }
      #overlay .keys { font-size: 13px; color: #9aa7b4; line-height: 1.8; }
      kbd {
        background: #1c232b; border: 1px solid #333e49; border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 7px; font-size: 12px; color: #cdd6df;
      }

      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 5;
        font-size: 12px; color: #8b98a6; line-height: 1.7;
        background: rgba(11,13,16,0.5); padding: 8px 12px; border-radius: 8px;
        pointer-events: none;
      }
      #hud b { color: #cdd6df; font-weight: 600; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.6);
        z-index: 4; pointer-events: none; display: none;
      }

      #toolbar {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
        display: flex; gap: 8px; background: rgba(18, 22, 28, 0.85);
        backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 12px;
        border: 1px solid #2f3844; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
      .btn {
        background: #222a35; border: 1px solid #3c4856; color: #d0dae5;
        padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
        cursor: pointer; transition: all 0.15s ease;
      }
      .btn:hover { background: #2f3b4a; border-color: #526377; color: #fff; }
      .btn.active { background: #3b82f6; border-color: #60a5fa; color: #fff; }
</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="toolbar">
      <div style="display:flex;gap:4px;background:#141920;padding:2px;border-radius:8px;border:1px solid #333e4d;margin-right:6px;">
        <button id="btn-v4" class="btn active" style="color:#38bdf8;font-weight:700;background:#0369a1;border-color:#38bdf8;" title="New 4K 120FPS High-Res Dataset (IMG_3780.MOV)">🚀 v4 (4K 120FPS)</button>
        <button id="btn-v3d-superclean" class="btn" style="color:#e0e7ff;font-weight:600;background:#312e81;border-color:#6366f1;" title="Dedicated High-Clarity Model: Aggressive scale regularization penalty (5e-8), floaters eradicated, SH=2">✨ v3D SuperClean</button>
        <button id="btn-playcanvas" class="btn" style="color:#f43f5e;font-weight:600;background:#881337;border-color:#f43f5e;" title="PlayCanvas Engine Mode with Streamed SOG and Recast Navigation">🎮 PlayCanvas Engine</button>
        <button id="btn-v3b-tight" class="btn" style="color:#38bdf8;font-weight:600;" title="Default: 3DGS Retrain with Scale Loss Penalty (2.5x scale penalty, 20k steps)">📐 v3B Tight Scale</button>
        <button id="btn-v3b-fix" class="btn" style="color:#4ade80;font-weight:600;" title="Option A: Needle-filtered, SH Clamped">✨ v3B (Clean Fix)</button>
        <button id="btn-v3b-inpaint" class="btn" style="color:#f59e0b;font-weight:600;" title="Option D: Inpaint ceiling cap sampled from real neighbors">🎨 v3B (Inpaint D)</button>
        <button id="btn-v3b" class="btn" style="color:#94a3b8;font-weight:500;" title="Version 3B: 1080p, SH=2, 30k steps (Balanced 1M)">🔥 v3B</button>
        <button id="btn-v3c" class="btn" style="color:#a855f7;font-weight:600;" title="Version 3C: 1080p, SH=2, 30k steps (Dense 1.5M)">⚡ v3C</button>
        <button id="btn-v2" class="btn" title="Version 2: 1080p, SH=1, 30k steps">✨ v2</button>
        <button id="btn-v1" class="btn" title="Version 1: 576p, SH=0, 15k steps">📦 v1</button>
      </div>
      <button id="btn-orbit" class="btn active">🔄 Orbit &amp; Zoom</button>
      <button id="btn-walk" class="btn">🚶 Walk (WASD)</button>
      <button id="btn-angle-limit" class="btn" title="Toggle soft look-up angle limit">🔭 Angle Limit: Off</button>
      <button id="btn-bg-toggle" class="btn" title="Toggle between Room Tone, Dark, and Magenta (Key B)">🎨 BG Mode</button>
      <button id="btn-reset" class="btn">🎯 Center</button>
      <button id="btn-bed" class="btn">🛏️ Bed</button>
      <button id="btn-desk" class="btn">🪑 Desk</button>
    </div>
    <div id="hud">
      <div><b>NammaSpace</b> — 3D Gaussian Splat Viewer</div>
      <div id="hud-scene">scene: —</div>
      <div id="hud-splat">splat: —</div>
      <div id="hud-cam">cam: —</div>
      <div id="hud-fps">fps: —</div>
    </div>
    <div id="overlay" class="hidden">
      <h1>NammaSpace &mdash; Desktop Free Roaming</h1>
      <div class="cta">Click to enter &amp; walk around</div>
      <div class="keys">
        <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move &nbsp;·&nbsp;
        <kbd>Mouse</kbd> look &nbsp;·&nbsp; <kbd>Q</kbd>/<kbd>E</kbd> down/up &nbsp;·&nbsp; <kbd>Shift</kbd> sprint<br />
        <kbd>R</kbd> reset camera &nbsp;·&nbsp; <kbd>Esc</kbd> release mouse
      </div>
    </div>
    <script type="module" src="/src/main.js">
</script>
  </body>
</html>
